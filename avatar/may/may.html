<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MAY AI</title>
<style>
:root { color-scheme: dark; --glass: rgba(20, 22, 30, 0.42); --line: rgba(255, 255, 255, 0.22); --accent: #3ee6b0; --fg: #fff; --bg: #0b0c10; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
#app { position: relative; width: 100%; max-width: 520px; height: 100dvh; margin: 0 auto; overflow: hidden; background: #c9d3d8; touch-action: none; user-select: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: #223; font-size: 15px; letter-spacing: .08em; }
.top { position: absolute; top: 0; inset-inline: 0; padding: 18px 18px 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; direction: ltr; }
.brand { text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; letter-spacing: .06em; font-weight: 500; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.name { font-size: 30px; font-weight: 700; letter-spacing: .02em; margin-top: 2px; }
.icons { display: flex; gap: 10px; margin-top: 10px; pointer-events: auto; }
.icons button, .menu { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.75); background: rgba(0,0,0,.08); color: #fff; display: grid; place-items: center; padding: 0; }
.icons button.off { opacity: .45; }
.menu { border: 0; background: none; pointer-events: auto; }
.menu svg, .icons svg { width: 20px; height: 20px; }
#hint { position: absolute; top: 132px; left: 18px; font-size: 11px; letter-spacing: .08em; color: rgba(255,255,255,.85); text-shadow: 0 1px 6px rgba(0,0,0,.5); direction: ltr; pointer-events: none; transition: opacity .6s; }
.fx { position: absolute; pointer-events: none; width: 0; height: 0; }
.fx .ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); transform: translate(-50%, -50%); animation: ring 1.1s ease-out forwards; }
.fx .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, #fff 0 35%, rgba(255,255,255,.35) 36% 60%, transparent 62%); animation: dot 1.3s ease-out forwards; }
.fx .tag { position: absolute; top: -10px; white-space: nowrap; font-size: 11px; line-height: 1.25; letter-spacing: .07em; text-shadow: 0 1px 6px rgba(0,0,0,.55); animation: tag 1.8s ease-out forwards; direction: ltr; }
.fx .tag b { display: block; font-size: 12.5px; font-weight: 700; }
.fx .tag span { display: block; font-size: 12px; direction: rtl; }
.press { position: absolute; pointer-events: none; width: 0; height: 0; z-index: 2; }
.press .shade { position: absolute; width: 64px; height: 64px; border-radius: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: transform .35s ease-out, opacity .35s; background: radial-gradient(circle, rgba(60,30,20,.30) 0 30%, rgba(60,30,20,.12) 50%, rgba(255,255,255,.18) 66%, transparent 72%); mix-blend-mode: multiply; }
.press.on .shade { transform: translate(-50%, -50%) scale(1); opacity: 1; }
.press .halo { position: absolute; width: 74px; height: 74px; border-radius: 50%; transform: translate(-50%, -50%); border: 1.5px solid rgba(160,240,255,.9); box-shadow: 0 0 14px rgba(120,220,255,.55), inset 0 0 10px rgba(120,220,255,.35); animation: halo 1.4s ease-in-out infinite; }
.press .halo.b { width: 104px; height: 104px; opacity: .5; animation-delay: .35s; }
@keyframes halo { 50% { transform: translate(-50%, -50%) scale(1.08); opacity: .55; } }
#say .who.me { color: #9fe8ff; }
@keyframes ring { from { width: 14px; height: 14px; opacity: 1; } to { width: 120px; height: 120px; opacity: 0; } }
@keyframes dot { 0% { opacity: 1; } 70% { opacity: .9; } 100% { opacity: 0; } }
@keyframes tag { 0% { opacity: 0; } 12% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.bottom { position: absolute; bottom: 0; inset-inline: 0; padding: 0 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; padding: 7px 13px; border-radius: 999px; font-size: 13.5px; }
.bar { display: flex; align-items: center; gap: 10px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; padding: 8px 10px; min-height: 58px; }
#mic { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; }
#mic.rec { background: #e5484d; animation: pulse 1s infinite; }
#mic svg { width: 20px; height: 20px; }
#say { flex: 1; min-width: 0; font-size: 15.5px; line-height: 1.35; }
#say .who { font-weight: 700; margin-inline-end: 4px; direction: ltr; unicode-bidi: isolate; }
#form { display: none; flex: 1; gap: 8px; }
.bar.typing #say { display: none; } .bar.typing #form { display: flex; }
#text { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font-size: 16px; outline: none; }
#text::placeholder { color: rgba(255,255,255,.65); }
#send, #kb { flex: none; border: 0; background: none; color: #fff; font-size: 14px; padding: 6px; }
#outfits { position: absolute; left: 14px; bottom: 132px; display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; padding: 8px; background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 14px; }
#outfits button { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,.35); padding: 0; position: relative; }
#outfits button.on { border-color: #ffd66b; box-shadow: 0 0 0 2px rgba(255,214,107,.35); }
#outfits .lbl { grid-column: 1 / -1; font-size: 10.5px; text-align: center; letter-spacing: .05em; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
#sheet { position: absolute; top: 64px; right: 14px; width: min(270px, calc(100% - 28px)); background: rgba(16,17,24,.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: none; z-index: 5; }
#sheet.on { display: block; }
#sheet h4 { margin: 0 0 8px; font-size: 12px; color: #bbc; font-weight: 600; letter-spacing: .05em; }
.modes { display: flex; gap: 6px; margin-bottom: 12px; }
.modes button { flex: 1; border: 1px solid var(--line); background: transparent; color: #fff; padding: 8px 0; border-radius: 10px; font-size: 14px; }
.modes button.on { background: #fff; color: #111; }
#sheet p { margin: 0; font-size: 12.5px; color: #cdd; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="MAY"></canvas>
  <div id="loading">LOADING…</div>
  <div class="top">
    <div class="brand">
      <div class="live"><i></i>LIVE</div>
      <div class="name">MAY AI</div>
      <div class="icons">
        <button id="voiceBtn" title="קול"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button id="kbBtn" title="הקלדה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
      </div>
    </div>
    <button class="menu" id="menuBtn" title="תפריט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="hint">TAP TO TOUCH · גע בה</div>
  <div id="sheet" dir="rtl">
    <h4>אופי</h4>
    <div class="modes"><button data-mode="soft">רכה</button><button data-mode="normal" class="on">רגילה</button><button data-mode="firm">קשוחה</button></div>
    <h4>אפשר להגיד לה</h4>
    <p>תעשי שרירים · תנופפי · תקרצי · תצחקי · תסדרי את השיער · ידיים על המותניים · תלבשי שחור / לבן / אדום — או סתם לדבר איתה. מגע: הקשה, החזקה, הקשה כפולה (צחוק), ליטוף השיער למטה, הקשה לידה (היא מסתכלת).</p>
  </div>
  <div id="outfits" dir="ltr"></div>
  <div class="bottom">
    <div class="chips">
      <button data-act="flex">💪 שרירים</button><button data-act="wave">👋 נפנוף</button><button data-act="hips">מותניים</button><button data-act="smile">😊 חיוך</button><button data-act="lookL">מבט שמאלה</button><button data-act="lookR">מבט ימינה</button><button data-act="hair">💁‍♀️ שיער</button><button data-act="wink">😉 קריצה</button><button data-act="laugh">😄 צחוק</button><button data-act="dance">💃 ריקוד</button>
    </div>
    <div class="bar" id="bar">
      <button id="mic" title="דבר"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <div id="say"><span class="who">MAY:</span><span id="sayText">רוצה שאראה לך תנועה מסוימת?</span></div>
      <form id="form"><input id="text" placeholder="כתוב לה…" autocomplete="off"><button id="send">שלח</button></form>
      <button id="kb" title="הקלדה">⌨</button>
    </div>
  </div>
</div>
<script>
// ===== MAY concept: invented photoreal character. Real body motion = video clips pinned to the stills at both ends;
// holds = stills with blink / speech patches; touch is detected per body region from pose + face landmarks. =====
const META = __META__;
const $ = (s) => document.querySelector(s);
const now = () => performance.now() / 1000;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const app = $('#app'), cv = $('#cv'), ctx = cv.getContext('2d');
const POSES = ['base', 'soft', 'wave', 'flex', 'hips', 'lookL', 'lookR', 'hair', 'wink', 'laugh'];
const OUTFITS = { red: { he: 'אדום', sw: '#d4182b' }, black: { he: 'שחור', sw: '#161616' }, white: { he: 'לבן', sw: '#f2f2ee' } };
const W = META.size[0], H = META.size[1];
const IMG = {}, PATCH = {}, BACK = {};
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
async function loadOutfit(o) {
  if (IMG[o]) return;
  const imgs = await Promise.all(POSES.map((k) => load(`img/${o}_${k}.webp`)));
  const pts = await Promise.all(['blink', 'talk', 'talk2'].map((k) => load(`img/${o}_p_${k}.webp`)));
  IMG[o] = Object.fromEntries(POSES.map((k, i) => [k, imgs[i]])); PATCH[o] = { blink: pts[0], talk: pts[1], talk2: pts[2] };
  const c = document.createElement('canvas'); c.width = 128; c.height = 192; const g = c.getContext('2d'); g.filter = 'blur(6px)'; g.drawImage(imgs[0], -8, -8, 144, 208); BACK[o] = c;
}

// ---------- state ----------
const S = { outfit: 'red', cur: 'base', from: null, fromOutfit: null, fade: 1, back: 0, mode: 'normal', voice: true, blink: 0, nextBlink: 2,
  talkT: 0, mouth: 0, speakingUntil: 0, nextIdle: 7 };
const M = () => META.outfits[S.outfit];
function still(state, hold) {
  if (state !== S.cur || S.fromOutfit) { S.from = S.cur; S.cur = state; S.fade = 0; }
  S.back = hold ? now() + hold : 0;
}

// ---------- video layer: real motion between the stills ----------
const vid = document.createElement('video'); vid.muted = true; vid.playsInline = true; vid.setAttribute('playsinline', ''); vid.preload = 'auto';
const clipExt = vid.canPlayType('video/mp4; codecs="avc1.42E01E"') ? '.mp4' : '.webm';
let clip = null;
const hasClip = (n) => !!META.clips?.[S.outfit]?.includes(n);
function playClip(name, onEnd) {
  if (!hasClip(name)) return false;
  clip = { name, onEnd, ready: false }; vid.src = `clips/${S.outfit}/${name}${clipExt}`; vid.currentTime = 0;
  vid.play().catch(() => { const c = clip; clip = null; c?.onEnd?.(); });
  return true;
}
vid.addEventListener('playing', () => { if (clip) clip.ready = true; });
vid.addEventListener('ended', () => { const c = clip; clip = null; c?.onEnd?.(); });
function stopIdleClip() { if (clip && /^idle_/.test(clip.name)) { clip = null; vid.pause(); } }
// move: video into the pose, hold the still, video back out (falls back to a crossfade when there is no clip)
function pose(p, hold) {
  stopIdleClip(); if (clip) return;
  if (p === 'base') { if (S.cur !== 'base') returnToBase(); return; }
  if (S.cur === p) { S.back = now() + hold; return; }
  if (S.cur === 'base' && playClip('to_' + p, () => { S.cur = p; S.from = null; S.fade = 1; S.back = now() + hold; })) return;
  still(p, hold);
}
function returnToBase() {
  const p = S.cur; S.back = 0;
  if (!playClip('to_' + p + '_rev', () => { S.cur = 'base'; S.from = null; S.fade = 1; })) still('base');
}
function dance() { stopIdleClip(); if (clip) return; if (S.cur !== 'base') still('base'); if (!playClip('dance', () => {})) still('hips', 2.5); }

// ---------- drawing ----------
let view = { s: 1, ox: 0, oy: 0 };
function resize() { const r = app.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
new ResizeObserver(resize).observe(app); resize();
function layout(breath) {
  // wide enough to keep her arms in frame on tall phones; the strip below is filled by a blurred backdrop
  const s = Math.max(cv.width / W * 1.18, cv.height / H * 0.84) * (1.0 + 0.004 * breath);
  view = { s, ox: (cv.width - W * s) / 2, oy: Math.min(0, (cv.height - H * s) * 0.25) };
}
const drawFull = (img, a) => { ctx.globalAlpha = a; ctx.drawImage(img, view.ox, view.oy, W * view.s, H * view.s); };
function featherBottom() {
  const y1 = view.oy + H * view.s; if (y1 >= cv.height || !BACK[S.outfit]) return;
  const h = 90 * (cv.width / 390), bs = Math.max(cv.width / W, cv.height / H), g = ctx.createLinearGradient(0, y1 - h, 0, y1);
  ctx.save(); ctx.beginPath(); ctx.rect(0, y1 - h, cv.width, h); ctx.clip();
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,1)');
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = g; ctx.fillRect(0, y1 - h, cv.width, h);
  ctx.globalCompositeOperation = 'destination-over'; ctx.drawImage(BACK[S.outfit], (cv.width - W * bs) / 2, cv.height - H * bs, W * bs, H * bs);
  ctx.restore(); ctx.globalCompositeOperation = 'source-over';
}
function drawPatch(name, a) {
  const p = M().patches[name], img = PATCH[S.outfit]?.[name]; if (!img || a <= 0.01) return;
  ctx.globalAlpha = a; ctx.drawImage(img, view.ox + p[0] * view.s, view.oy + p[1] * view.s, p[2] * view.s, p[3] * view.s);
}
let last = now(); const t0 = now();
function frame() {
  requestAnimationFrame(frame);
  const t = now(), dt = Math.min(0.05, t - last); last = t;
  if (!IMG[S.outfit]) return;
  if (S.back && t > S.back && !clip) returnToBase();
  S.fade = Math.min(1, S.fade + dt / 0.38);
  S.nextBlink -= dt; if (S.nextBlink < 0) { S.blink = 1; S.nextBlink = 2.2 + Math.random() * 3.8; if (Math.random() < 0.15) S.nextBlink = 0.3; }
  S.blink = Math.max(0, S.blink - dt / 0.16);
  const talking = t < S.speakingUntil;
  if (talking) { S.talkT += dt; const ph = S.talkT * 9.5; S.mouth = (Math.sin(ph) * 0.5 + 0.5) * (0.65 + 0.35 * Math.sin(ph * 0.37)); }
  else S.mouth = Math.max(0, S.mouth - dt * 6);
  // idle life: real breathing / wind / weight-shift clips, or a glance
  if (!clip && S.cur === 'base' && S.fade >= 1 && !talking && !down && t - t0 > S.nextIdle) {
    S.nextIdle = t - t0 + 6 + Math.random() * 7;
    const idles = ['idle_a', 'idle_b'].filter(hasClip);
    if (idles.length && Math.random() < 0.75) playClip(idles[Math.floor(Math.random() * idles.length)], () => {});
    else still(['soft', 'lookL', 'lookR', 'hair', 'wink'][Math.floor(Math.random() * 5)], 2);
  }
  const breath = clip ? 0 : Math.sin((t - t0) * 1.6);
  layout(breath);
  ctx.globalAlpha = 1; ctx.clearRect(0, 0, cv.width, cv.height);
  if (H * view.s < cv.height && BACK[S.outfit]) { const bs = Math.max(cv.width / W, cv.height / H); ctx.drawImage(BACK[S.outfit], (cv.width - W * bs) / 2, cv.height - H * bs, W * bs, H * bs); }
  if (clip && clip.ready && vid.readyState >= 2) { drawFull(vid, 1); featherBottom(); ctx.globalAlpha = 1; return; }
  const ease = S.fade * S.fade * (3 - 2 * S.fade), set = IMG[S.outfit], prev = S.fromOutfit ? IMG[S.fromOutfit] : set;
  if (S.from && ease < 1) drawFull(prev[S.from], 1);
  drawFull(set[S.cur], S.from && ease < 1 ? ease : 1);
  if (ease >= 1) S.fromOutfit = null;
  const baseW = S.cur === 'base' ? ease : 0;
  if (baseW > 0.02) {
    drawPatch('blink', Math.min(1, S.blink * 2.2) * baseW);
    if (S.mouth > 0.02) { drawPatch('talk', Math.min(1, S.mouth * 1.4) * baseW); drawPatch('talk2', Math.max(0, Math.sin(S.talkT * 4.1)) * S.mouth * baseW * 0.8); }
  }
  featherBottom(); ctx.globalAlpha = 1;
}

// ---------- outfits ----------
const ob = $('#outfits');
for (const [k, o] of Object.entries(OUTFITS)) { const b = document.createElement('button'); b.dataset.o = k; b.title = o.he; b.style.background = o.sw; ob.append(b); }
const lbl = document.createElement('div'); lbl.className = 'lbl'; ob.append(lbl);
function markOutfit() { ob.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.o === S.outfit)); lbl.textContent = 'Swimsuit · ' + OUTFITS[S.outfit].he; }
async function setOutfit(o) {
  if (!OUTFITS[o] || o === S.outfit) return;
  stopIdleClip(); if (clip) { clip = null; vid.pause(); }
  await loadOutfit(o);
  S.fromOutfit = S.outfit; S.from = S.cur; S.outfit = o; S.cur = 'base'; S.fade = 0; S.back = 0; markOutfit();
  setTimeout(() => pose('hips', 2.4), 500);
  say({ red: 'האדום, הקלאסי שלי.', black: 'שחור תמיד עובד.', white: 'לבן לשקיעה, מושלם.' }[o]);
}
ob.addEventListener('click', (e) => { const o = e.target.dataset?.o; if (o) setOutfit(o); });

// ---------- touch ----------
const toImg = (cx, cy) => { const r = cv.getBoundingClientRect(), d = cv.width / r.width; return { x: ((cx - r.left) * d - view.ox) / view.s, y: ((cy - r.top) * d - view.oy) / view.s }; };
function segD(p, a, b) { const abx = b.x - a.x, aby = b.y - a.y, t = clamp(((p.x - a.x) * abx + (p.y - a.y) * aby) / (abx * abx + aby * aby || 1), 0, 1); return Math.hypot(p.x - a.x - abx * t, p.y - a.y - aby * t); }
function regionAt(p) {
  const R = M().regions[clip ? 'base' : S.cur] || M().regions.base, P = (i) => ({ x: R.pose[i][0] * W, y: R.pose[i][1] * H });
  if (R.face) {
    const top = R.face[0][1] * H, chin = R.face[1][1] * H, l = R.face[2][0] * W, r = R.face[3][0] * W, cx = (l + r) / 2, cy = (top + chin) / 2;
    const e = ((p.x - cx) / ((r - l) / 2)) ** 2 + ((p.y - cy) / ((chin - top) / 2)) ** 2;
    if (e < 1) return { r: 'face', he: 'פנים' };
    if (e < 2.6 && p.y < chin) return { r: 'hair', he: 'שיער' };
    // long hair falls beside the neck and over the shoulders
    const fh = chin - top, dx = Math.abs(p.x - cx);
    if (p.y > top && p.y < chin + fh * 1.3 && dx > (r - l) * 0.55 && dx < (r - l) * 1.25) return { r: 'hair', he: 'שיער' };
  }
  if (!R.pose) return null;
  const sideOf = (i) => (i % 2 ? 'L' : 'R');
  for (const [w, h1] of [[15, 19], [16, 20]]) if (segD(p, P(w), P(h1)) < 48) return { r: 'hand', side: sideOf(w), he: 'כף יד' };
  for (const [a, b] of [[11, 13], [13, 15], [12, 14], [14, 16]]) if (segD(p, P(a), P(b)) < 52) return { r: 'arm', side: sideOf(a), he: 'זרוע · קעקוע' };
  for (const s of [11, 12]) if (Math.hypot(p.x - P(s).x, p.y - P(s).y) < 62) return { r: 'shoulder', side: sideOf(s), he: 'כתף' };

}
const LINES = {
  face: ['היי 🙂', 'חח, זה מדגדג', 'אני רואה אותך', 'נו, תפסיק להצחיק אותי'], hair: ['אהבת את השיער? 😉', 'שעה מול המראה בבוקר!'],
  hand: ['היי! תן כיף', 'נעים להכיר 👋'], arm: ['מרגיש את השריר? 💪', 'בוא, תנסה להתחרות איתי'], shoulder: ['כן?', 'מה קורה?'],
  chest: ['היי, בעדינות 🙂'], belly: ['שש שעות אימון בשבוע 😅', 'חחח זה מדגדג'], legs: ['אני כאן למעלה 😉', 'רגליים של ריצה'],

const pickLine = (r) => { const a = LINES[r] || ['כן?']; return a[Math.floor(Math.random() * a.length)]; };
function react(reg) {

    case 'hair': still('hair', 2.8); break;

function fx(cx, cy, reg) {
  const r = app.getBoundingClientRect(), x = cx - r.left, y = cy - r.top, el = document.createElement('div');

    `<div class="tag" style="${leftSide ? 'right:44px;text-align:right' : 'left:44px'}"><b>TOUCH DETECTED</b>${reg ? `<span>${reg.he}</span>` : ''}</div>`;

// while the finger stays down, a glowing marker sticks to the spot with a soft press shading; holding gets its own reaction
const HOLD = { face: ['חחח, אתה מסמיק אותי', 'נו… 🙂'], hair: ['רך, נכון? 🙂'], hand: ['חחח, אתה לא עוזב?', 'יד חזקה, אה?'], arm: ['תרגיש, הכל קשה 💪', 'שנה של אימונים'],
  shoulder: ['הכתפיים שלי מכווצות מהאימון'], chest: ['היי, בעדינות 🙂'], belly: ['חחח מדגדג!', 'תרגיש, הכל אמיתי'], legs: ['רגליים של ריצה 🏃‍♀️'] };
let down = false, press = null, holdT = null;
const placeAt = (el, cx, cy) => { const r = app.getBoundingClientRect(); el.style.left = cx - r.left + 'px'; el.style.top = cy - r.top + 'px'; };
let lastTap = 0, swipe = null;
cv.addEventListener('pointerdown', (e) => {

  if (!reg && !clip) { const r = app.getBoundingClientRect(); still(e.clientX - r.left < r.width / 2 ? 'lookR' : 'lookL', 1.8); say(['מה יש שם?', 'מה ראית?'][Math.floor(Math.random() * 2)], false); }

  if (down && swipe && swipe.reg?.r === 'hair' && e.clientY - swipe.y > 40) { swipe = null; still('hair', 3); say('אהבת? 😉', false); }

const lift = () => { down = false; clearTimeout(holdT); if (press) { const p = press; press = null; p.classList.remove('on'); p.style.transition = 'opacity .4s'; p.style.opacity = 0; setTimeout(() => p.remove(), 420); } };
addEventListener('pointerup', lift); addEventListener('pointercancel', lift);

// ---------- speech ----------
const sayText = $('#sayText');
function say(text, speak = true) {
  const w = document.querySelector('#say .who'); w.textContent = 'MAY:'; w.classList.remove('me');
  sayText.textContent = text;
  const dur = Math.max(1.0, text.length / 13);
  const start = () => { stopIdleClip(); S.speakingUntil = now() + dur; S.talkT = 0; };
  if (S.voice && speak !== false && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = /[֐-׿]/.test(text) ? 'he-IL' : 'en-US';
    u.rate = S.mode === 'firm' ? 1.08 : S.mode === 'soft' ? 0.94 : 1.0; u.pitch = S.mode === 'firm' ? 0.9 : 1.08;
    u.onstart = start; u.onend = u.onerror = () => { S.speakingUntil = 0; };
    speechSynthesis.speak(u);
  } else if (speak !== false) start();
}

// ---------- commands + chat ----------
const ACT = { flex: () => pose('flex', 3.2), wave: () => pose('wave', 2.6), hips: () => pose('hips', 3.2), smile: () => still('soft', 3), lookL: () => still('lookL', 2.6), lookR: () => still('lookR', 2.6), dance,
  hair: () => still('hair', 3), wink: () => still('wink', 2), laugh: () => still('laugh', 2.6),
  red: () => setOutfit('red'), white: () => setOutfit('white'), black: () => setOutfit('black') };
const CMDS = [[/תקרצי|קריצה|wink/, 'wink'], [/תצחקי|צחוק|laugh/, 'laugh'], [/שיער|תסדרי|hair/, 'hair'], [/תרקדי|ריקוד|dance/, 'dance'], [/אדום|red/, 'red'], [/לבן|white/, 'white'], [/שחור|black/, 'black'], [/שריר|פלקס|תכופפי|flex|muscle|bicep/, 'flex'],
  [/תנופפי|נפנוף|נפנפי|שלום|wave|hello/, 'wave'], [/מותניים|power|hips/, 'hips'], [/תחייכי|חיוך|smile/, 'smile'], [/שמאל|left/, 'lookL'], [/ימין|right/, 'lookR']];

const OFFLINE = { soft: ['אני כאן, ספר לי עוד.', 'זה נשמע חשוב לך.'], normal: ['חחח, אהבתי. ועוד?', 'מעניין! מה עוד?'], firm: ['קדימה, בלי תירוצים.', 'שוב. יותר ברור.'] };
const MODES = { soft: 'Mode SOFT: gentle, warm, patient and encouraging.', normal: 'Mode NORMAL: friendly, witty, playful and curious, like a good friend.', firm: 'Mode FIRM: tough, direct, demanding like a no-nonsense coach; dry humor, never cruel.' };
const history = [];

  const prompt = 'You are "MAY", an original fictional character in a live app: an athletic, warm and playful fitness coach at the beach. Reply in the user\'s language (default Hebrew) in 1-2 short spoken-style sentences. Banter, coach, play games. Keep everything non-sexual and non-explicit; if asked for sexual content, steer playfully elsewhere without lecturing. Optionally start with one action tag when the user asks for a movement or outfit: [do:flex] [do:wave] [do:hips] [do:smile] [do:wink] [do:laugh] [do:hair] [do:dance] [do:lookL] [do:lookR] [do:red] [do:white] [do:black]. ' + MODES[S.mode] + '\n\nConversation:\n' + convo + '\nMAY:';
