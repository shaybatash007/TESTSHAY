<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AURA AI</title>
<style>
:root { color-scheme: dark; --glass: rgba(20, 22, 30, 0.42); --line: rgba(255, 255, 255, 0.22); --accent: #3ee6b0; --fg: #fff; --bg: #0b0c10; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
#app { position: relative; width: 100%; max-width: 520px; height: 100dvh; margin: 0 auto; overflow: hidden; background: #c9d3d8; touch-action: none; user-select: none; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: #223; font-size: 15px; letter-spacing: .08em; }
.top { position: absolute; top: 0; inset-inline: 0; padding: 18px 18px 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; direction: ltr; }
.brand { text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; letter-spacing: .06em; font-weight: 500; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.name { font-size: 30px; font-weight: 700; letter-spacing: .02em; margin-top: 2px; }
.icons { display: flex; gap: 10px; margin-top: 10px; pointer-events: auto; }
.icons button, .menu { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.75); background: rgba(0,0,0,.08); color: #fff; display: grid; place-items: center; padding: 0; }
.icons button.off { opacity: .45; }
.menu { border: 0; background: none; pointer-events: auto; }
.menu svg, .icons svg { width: 20px; height: 20px; }
#hint { position: absolute; top: 132px; left: 18px; font-size: 11px; letter-spacing: .08em; color: rgba(255,255,255,.85); text-shadow: 0 1px 6px rgba(0,0,0,.5); direction: ltr; pointer-events: none; transition: opacity .6s; }
.fx { position: absolute; pointer-events: none; width: 0; height: 0; }
.fx .ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); transform: translate(-50%, -50%); animation: ring 1.1s ease-out forwards; }
.fx .dot { position: absolute; width: 22px; height: 22px; border-radius: 50%; transform: translate(-50%, -50%); background: radial-gradient(circle, #fff 0 35%, rgba(255,255,255,.35) 36% 60%, transparent 62%); animation: dot 1.3s ease-out forwards; }
.fx .tag { position: absolute; top: -10px; white-space: nowrap; font-size: 11px; line-height: 1.25; letter-spacing: .07em; text-shadow: 0 1px 6px rgba(0,0,0,.55); animation: tag 1.8s ease-out forwards; direction: ltr; }
.fx .tag b { display: block; font-size: 12.5px; font-weight: 700; }
.fx .tag span { display: block; font-size: 12px; direction: rtl; }
@keyframes ring { from { width: 14px; height: 14px; opacity: 1; } to { width: 120px; height: 120px; opacity: 0; } }
@keyframes dot { 0% { opacity: 1; } 70% { opacity: .9; } 100% { opacity: 0; } }
@keyframes tag { 0% { opacity: 0; } 12% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
.bottom { position: absolute; bottom: 0; inset-inline: 0; padding: 0 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; padding: 7px 13px; border-radius: 999px; font-size: 13.5px; }
.bar { display: flex; align-items: center; gap: 10px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 18px; padding: 8px 10px; min-height: 58px; }
#mic { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; }
#mic.rec { background: #e5484d; animation: pulse 1s infinite; }
#mic svg { width: 20px; height: 20px; }
#say { flex: 1; min-width: 0; font-size: 15.5px; line-height: 1.35; }
#say .who { font-weight: 700; margin-inline-end: 4px; direction: ltr; unicode-bidi: isolate; }
#form { display: none; flex: 1; gap: 8px; }
.bar.typing #say { display: none; } .bar.typing #form { display: flex; }
#text { flex: 1; min-width: 0; background: transparent; border: 0; color: #fff; font-size: 16px; outline: none; }
#text::placeholder { color: rgba(255,255,255,.65); }
#send, #kb { flex: none; border: 0; background: none; color: #fff; font-size: 14px; padding: 6px; }
#sheet { position: absolute; top: 64px; right: 14px; width: min(270px, calc(100% - 28px)); background: rgba(16,17,24,.82); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: none; z-index: 5; }
#sheet.on { display: block; }
#sheet h4 { margin: 0 0 8px; font-size: 12px; color: #bbc; font-weight: 600; letter-spacing: .05em; }
.modes { display: flex; gap: 6px; margin-bottom: 12px; }
.modes button { flex: 1; border: 1px solid var(--line); background: transparent; color: #fff; padding: 8px 0; border-radius: 10px; font-size: 14px; }
.modes button.on { background: #fff; color: #111; }
#sheet p { margin: 0; font-size: 12.5px; color: #cdd; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="AURA"></canvas>
  <div id="loading">LOADING…</div>
  <div class="top">
    <div class="brand">
      <div class="live"><i></i>LIVE</div>
      <div class="name">AURA AI</div>
      <div class="icons">
        <button id="voiceBtn" title="קול"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
        <button id="kbBtn" title="הקלדה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></button>
      </div>
    </div>
    <button class="menu" id="menuBtn" title="תפריט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="hint">TAP TO TOUCH · גע בה</div>
  <div id="sheet" dir="rtl">
    <h4>אופי</h4>
    <div class="modes"><button data-mode="soft">רכה</button><button data-mode="normal" class="on">רגילה</button><button data-mode="firm">קשוחה</button></div>
    <h4>אפשר להגיד לה</h4>
    <p>תעשי שרירים · תנופפי · ידיים על המותניים · תחייכי · תסתכלי ימינה / שמאלה — או סתם לדבר איתה.</p>
  </div>
  <div class="bottom">
    <div class="chips">
      <button data-act="flex">💪 שרירים</button><button data-act="wave">👋 נפנוף</button><button data-act="hips">מותניים</button><button data-act="smile">😊 חיוך</button><button data-act="lookL">מבט שמאלה</button><button data-act="lookR">מבט ימינה</button>
    </div>
    <div class="bar" id="bar">
      <button id="mic" title="דבר"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <div id="say"><span class="who">AURA:</span><span id="sayText">רוצה שאראה לך תנועה מסוימת?</span></div>
      <form id="form"><input id="text" placeholder="כתוב לה…" autocomplete="off"><button id="send">שלח</button></form>
      <button id="kb" title="הקלדה">⌨</button>
    </div>
  </div>
</div>

  if (baseW > 0.02) {
    const bl = S.blink > 0 ? Math.min(1, S.blink * 2.2) : 0; drawPatch('blink', bl * baseW);
    if (S.mouth > 0.02) { drawPatch('talk', Math.min(1, S.mouth * 1.4) * baseW); drawPatch('talk2', Math.max(0, Math.sin(S.talkT * 4.1)) * S.mouth * baseW * 0.8); }
  }
  ctx.globalAlpha = 1;
}

// ---------- touch: which part of her body did you touch (pose + face landmarks of the frame on screen) ----------
const toImg = (cx, cy) => { const r = cv.getBoundingClientRect(), d = cv.width / r.width; return { x: ((cx - r.left) * d - view.ox) / view.s, y: ((cy - r.top) * d - view.oy) / view.s }; };
function segD(p, a, b) { const abx = b.x - a.x, aby = b.y - a.y, t = clamp(((p.x - a.x) * abx + (p.y - a.y) * aby) / (abx * abx + aby * aby || 1), 0, 1); return Math.hypot(p.x - a.x - abx * t, p.y - a.y - aby * t); }
function regionAt(p) {
  const R = META.regions[S.cur] || META.regions.base, P = (i) => ({ x: R.pose[i][0] * W, y: R.pose[i][1] * H });
  if (R.face) {
    const top = R.face[0][1] * H, chin = R.face[1][1] * H, l = R.face[2][0] * W, r = R.face[3][0] * W, cx = (l + r) / 2, cy = (top + chin) / 2;
    const rx = (r - l) / 2, ry = (chin - top) / 2, e = ((p.x - cx) / rx) ** 2 + ((p.y - cy) / ry) ** 2;
    if (e < 1) return { r: 'face', he: 'פנים' };
    if (e < 2.6 && p.y < chin) return { r: 'hair', he: 'שיער' };
  }
  if (!R.pose) return null;
  const sideOf = (i) => (i % 2 ? 'L' : 'R');                // odd = her left (screen right)
  for (const [w, h1] of [[15, 19], [16, 20]]) if (segD(p, P(w), P(h1)) < 48) return { r: 'hand', side: sideOf(w), he: 'כף יד' };
  for (const [a, b] of [[11, 13], [13, 15], [12, 14], [14, 16]]) if (segD(p, P(a), P(b)) < 52) return { r: 'arm', side: sideOf(a), he: 'זרוע' };
  for (const s of [11, 12]) if (Math.hypot(p.x - P(s).x, p.y - P(s).y) < 62) return { r: 'shoulder', side: sideOf(s), he: 'כתף' };
  const sh = (P(11).y + P(12).y) / 2, hp = (P(23).y + P(24).y) / 2, minX = Math.min(P(12).x, P(24).x) - 10, maxX = Math.max(P(11).x, P(23).x) + 10;
  if (p.y > sh && p.y < hp + 30 && p.x > minX && p.x < maxX) return p.y < sh + (hp - sh) * 0.45 ? { r: 'chest', he: 'גוף' } : { r: 'belly', he: 'בטן' };
  for (const [a, b] of [[23, 25], [24, 26], [25, 27], [26, 28]]) if (segD(p, P(a), P(b)) < 70) return { r: 'legs', side: sideOf(a), he: 'רגל' };
  return null;
}
const LINES = {
  face: ['היי 🙂', 'חח, זה מדגדג', 'אני רואה אותך'], hair: ['השיער שלי? חחח', 'אל תהרוס לי את הקוקו!'],
  hand: ['היי! תן כיף', 'נעים להכיר 👋'], arm: ['מרגיש את השריר?', 'יש פה עבודה קשה 💪'], shoulder: ['כן?', 'מה קורה?'],
  chest: ['היי, בעדינות 🙂'], belly: ['שש שעות אימון בשבוע 😅', 'חחח זה מדגדג'], legs: ['אני כאן למעלה 😉', 'רגליים של ריצה'],
};
const pickLine = (r) => { const a = LINES[r] || ['כן?']; return a[Math.floor(Math.random() * a.length)]; };
function react(reg) {
  switch (reg.r) {
    case 'face': show('soft', 2.4); break;
    case 'hair': show(Math.random() < 0.5 ? 'lookL' : 'lookR', 2); break;
    case 'hand': show('wave', 2.8); break;
    case 'arm': show('flex', 3.2); break;
    case 'shoulder': show(reg.side === 'L' ? 'lookL' : 'lookR', 2.4); break;
    case 'chest': case 'belly': show('hips', 2.8); break;
    case 'legs': show('soft', 2.2); break;
  }
  say(pickLine(reg.r), false);
}
function fx(cx, cy, reg) {
  const r = app.getBoundingClientRect(), x = cx - r.left, y = cy - r.top, el = document.createElement('div');
  el.className = 'fx'; el.style.left = x + 'px'; el.style.top = y + 'px';
  const leftSide = x > r.width / 2;
  el.innerHTML = '<div class="dot"></div><div class="ring"></div><div class="ring" style="animation-delay:.18s"></div><div class="ring" style="animation-delay:.36s"></div>' +
    `<div class="tag" style="${leftSide ? 'right:44px;text-align:right' : 'left:44px'}"><b>TOUCH DETECTED</b>${reg ? `<span>${reg.he}</span>` : ''}</div>`;
  app.append(el); setTimeout(() => el.remove(), 1900);
}
let down = false;
cv.addEventListener('pointerdown', (e) => {
  down = true; $('#hint').style.opacity = 0; $('#sheet').classList.remove('on');
  const p = toImg(e.clientX, e.clientY), reg = regionAt(p);
  fx(e.clientX, e.clientY, reg); navigator.vibrate?.(reg ? 14 : 5);
  if (reg) react(reg);
});
addEventListener('pointerup', () => (down = false)); addEventListener('pointercancel', () => (down = false));

// ---------- speech ----------
const sayText = $('#sayText');
function say(text, speak = true) {
  sayText.textContent = text;
  const dur = Math.max(1.0, text.length / 13);
  if (S.voice && speak !== false && 'speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = /[֐-׿]/.test(text) ? 'he-IL' : 'en-US';
    u.rate = S.mode === 'firm' ? 1.08 : S.mode === 'soft' ? 0.94 : 1.0; u.pitch = S.mode === 'firm' ? 0.9 : 1.08;
    u.onstart = () => { if (S.cur !== 'base' && !S.back) show('base'); S.speakingUntil = now() + dur; S.talkT = 0; };
    u.onend = u.onerror = () => { S.speakingUntil = 0; };
    speechSynthesis.speak(u);
  } else if (speak !== false) { S.speakingUntil = now() + dur; S.talkT = 0; }
}

// ---------- commands + chat ----------
const ACT = { flex: () => show('flex', 3.5), wave: () => show('wave', 3), hips: () => show('hips', 3.5), smile: () => show('soft', 3), lookL: () => show('lookL', 2.6), lookR: () => show('lookR', 2.6) };
const CMDS = [[/שריר|פלקס|תכופפי|flex|muscle|bicep/, 'flex'], [/תנופפי|נפנוף|נפנפי|שלום|wave|hello/, 'wave'], [/מותניים|power|hips/, 'hips'],
  [/תחייכי|חיוך|smile/, 'smile'], [/שמאל|left/, 'lookL'], [/ימין|right/, 'lookR']];
const parse = (t) => { t = t.toLowerCase(); for (const [re, a] of CMDS) if (re.test(t)) return a; return null; };
const OFFLINE = { soft: ['אני כאן, ספר לי עוד.', 'זה נשמע חשוב לך.'], normal: ['חחח, אהבתי. ועוד?', 'מעניין! מה עוד?'], firm: ['קדימה, בלי תירוצים.', 'שוב. יותר ברור.'] };
const MODES = { soft: 'Mode SOFT: gentle, warm, patient and encouraging.', normal: 'Mode NORMAL: friendly, witty, playful and curious, like a good friend.', firm: 'Mode FIRM: tough, direct, demanding like a no-nonsense coach; dry humor, never cruel.' };
const history = [];
async function ask(text) {
  const sample = window.claude?.use ? await claude.use('sample') : null;
  if (!sample) throw new Error('offline');
  const convo = history.slice(-12).map((m) => (m.role === 'user' ? 'User: ' : 'AURA: ') + m.content).join('\n');
  const prompt = 'You are "AURA", an original fictional character in a live app: an athletic, upbeat fitness coach at the beach. Reply in the user\'s language (default Hebrew) in 1-2 short spoken-style sentences. Banter, coach, play games. Keep everything non-sexual and non-explicit; if asked for sexual content, steer playfully elsewhere without lecturing. Optionally start with one action tag when the user asks for a movement: [do:flex] [do:wave] [do:hips] [do:smile] [do:lookL] [do:lookR]. ' + MODES[S.mode] + '\n\nConversation:\n' + convo + '\nAURA:';
  const r = await sample(prompt, { cache: false });
  let out = (r.text || '').trim(), act = null; const m = out.match(/^\[do:(\w+)\]\s*/); if (m) { act = m[1]; out = out.slice(m[0].length); }
  return { reply: out, act };
}
async function send(text) {
  history.push({ role: 'user', content: text });
  const cmd = parse(text); if (cmd) ACT[cmd]();
  sayText.textContent = '…';
  let out; try { out = await ask(text); } catch { const pool = OFFLINE[S.mode]; out = { reply: cmd ? 'הנה!' : pool[Math.floor(Math.random() * pool.length)] }; }
  if (!cmd && out.act && ACT[out.act]) ACT[out.act]();
  history.push({ role: 'assistant', content: out.reply }); say(out.reply);
}
$('#form').addEventListener('submit', (e) => { e.preventDefault(); const t = $('#text').value.trim(); if (!t) return; $('#text').value = ''; $('#bar').classList.remove('typing'); send(t); });
const openKb = () => { $('#bar').classList.add('typing'); $('#text').focus(); };
$('#kb').addEventListener('click', openKb); $('#kbBtn').addEventListener('click', openKb);
$('#text').addEventListener('blur', () => setTimeout(() => { if (!$('#text').value) $('#bar').classList.remove('typing'); }, 150));
$('#voiceBtn').addEventListener('click', () => { S.voice = !S.voice; $('#voiceBtn').classList.toggle('off', !S.voice); if (!S.voice) speechSynthesis?.cancel(); });
$('#menuBtn').addEventListener('click', () => $('#sheet').classList.toggle('on'));
document.querySelectorAll('.modes button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.modes button').forEach((x) => x.classList.toggle('on', x === b)); S.mode = b.dataset.mode;
  say({ soft: 'היי, אני כאן. בקצב שלך.', normal: 'היי! מה עושים היום?', firm: 'טוב. מוכנה. תן לי משימה.' }[S.mode]);
}));
document.querySelectorAll('.chips button').forEach((b) => b.addEventListener('click', () => { ACT[b.dataset.act](); navigator.vibrate?.(8); }));
const SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $('#mic');
if (!SR) mic.addEventListener('click', openKb);
else {
  const rec = new SR(); rec.lang = 'he-IL';
  rec.onresult = (e) => send(e.results[0][0].transcript); rec.onend = () => mic.classList.remove('rec');
  mic.addEventListener('click', () => { speechSynthesis?.cancel(); mic.classList.add('rec'); try { rec.start(); } catch {} });
}

// ---------- boot ----------
(async () => {
  try {
    const [imgs, patches] = await Promise.all([Promise.all(STATES.map((k) => load(`img/${k}.webp`))), Promise.all(['blink', 'talk', 'talk2'].map((k) => load(`img/p_${k}.webp`)))]);
    STATES.forEach((k, i) => (IMG[k] = imgs[i])); ['blink', 'talk', 'talk2'].forEach((k, i) => (PATCH[k] = patches[i]));
    $('#loading').remove(); requestAnimationFrame(frame);
    window.__aura = { S, show, regionAt, toImg, ACT, say };
  } catch (e) { $('#loading').textContent = 'הטעינה נכשלה. נסה לרענן.'; }
})();
</script>
</body>
