<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Noa Live</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="modes" role="tablist">
    <button data-mode="soft">רכה</button>
    <button data-mode="normal" class="on">רגילה</button>
    <button data-mode="firm">קשוחה</button>
  </div>

  <div id="stage">
    <canvas id="avatar" aria-label="Noa"></canvas><div id="loading">טוענת…</div>
    <div id="bubble" hidden></div>
  </div>

  <div class="chips">
    <button id="styleBtn" class="styleBtn">בגדים ▾</button><button data-act="flex">שרירים</button><button data-act="smile">חיוך</button><button data-act="turn">סיבוב</button>
    <button data-act="wink">קריצה</button><button data-act="wave">נופפי</button><button data-act="hips">מותניים</button><button data-act="laugh">צחוק</button><button data-act="serious">רצינית</button>
  </div>
  <div id="styleBar" hidden>
    <div class="lbl">בגדים</div><div class="row" id="outfitRow"></div>
  </div>
  <div id="log" aria-live="polite"></div>

  <form id="form">
    <button type="button" id="mic" title="דבר">🎤</button>
    <input id="text" placeholder="כתוב לה: תעשי שרירים, תחייכי, תלבשי בגד ים…" autocomplete="off">
    <button type="submit">שלח</button>
  </form>
  <div class="foot"><label class="voice"><input type="checkbox" id="voice" checked> קול</label></div>
</main>
<script src="app.js"></script>
</body>
</html>
